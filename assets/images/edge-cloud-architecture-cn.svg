<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Green-Edge-Cloud 系统架构</title>
  <desc id="desc">离线阶段使用教师思维链数据适配 15 亿参数学生模型。在线阶段由学生模型生成候选答案和词元概率，计算长度归一化置信度并与阈值比较，随后在本地返回或调用 720 亿参数云端教师模型。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#0071e3"/>
    </marker>
    <style>
      .label{font:700 22px "Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:2px;fill:#6e6e73}
      .title{font:700 27px "Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#111111}
      .sub{font:400 20px "Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#6e6e73}
      .tiny{font:400 17px "Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#6e6e73}
      .route{font:700 18px Arial,"Helvetica Neue",sans-serif;fill:#0071e3}
      .box{fill:#ffffff;stroke:#d2d2d7;stroke-width:2}
      .accent{fill:#f8fbff;stroke:#0071e3;stroke-width:2.5}
      .line{fill:none;stroke:#0071e3;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="640" rx="30" fill="#f5f5f7"/>

  <text class="label" x="48" y="52">离线适配</text>
  <rect class="box" x="48" y="78" width="190" height="92" rx="18"/>
  <text class="title" x="143" y="116" text-anchor="middle">72B 教师模型</text>
  <text class="sub" x="143" y="146" text-anchor="middle">Qwen2.5</text>

  <path class="line" d="M238 124H326"/>
  <text class="tiny" x="282" y="106" text-anchor="middle">生成</text>

  <rect class="box" x="342" y="78" width="230" height="92" rx="18"/>
  <text class="title" x="457" y="116" text-anchor="middle">筛选后的 CoT</text>
  <text class="sub" x="457" y="146" text-anchor="middle">推理数据</text>

  <path class="line" d="M572 124H646"/>
  <rect class="box" x="662" y="78" width="180" height="92" rx="18"/>
  <text class="title" x="752" y="116" text-anchor="middle">LoRA</text>
  <text class="sub" x="752" y="146" text-anchor="middle">参数适配</text>

  <path class="line" d="M842 124H910"/>
  <rect class="accent" x="926" y="78" width="226" height="92" rx="18"/>
  <text class="title" x="1039" y="116" text-anchor="middle">1.5B 学生模型</text>
  <text class="sub" x="1039" y="146" text-anchor="middle">蒸馏后模型</text>

  <path d="M48 210H1152" stroke="#d2d2d7" stroke-width="2"/>
  <text class="label" x="48" y="258">在线推理</text>

  <rect class="box" x="48" y="320" width="128" height="96" rx="18"/>
  <text class="title" x="112" y="378" text-anchor="middle">查询</text>
  <path class="line" d="M176 368H222"/>

  <rect class="accent" x="238" y="304" width="200" height="128" rx="20"/>
  <text class="title" x="338" y="352" text-anchor="middle">1.5B 学生</text>
  <text class="sub" x="338" y="384" text-anchor="middle">端侧角色</text>
  <text class="tiny" x="338" y="410" text-anchor="middle">先行生成</text>
  <path class="line" d="M438 368H482"/>

  <rect class="box" x="498" y="304" width="222" height="128" rx="20"/>
  <text class="title" x="609" y="346" text-anchor="middle">候选答案</text>
  <text class="sub" x="609" y="380" text-anchor="middle">生成词元</text>
  <text class="sub" x="609" y="408" text-anchor="middle">对数概率</text>
  <path class="line" d="M720 368H764"/>

  <rect class="box" x="780" y="304" width="216" height="128" rx="20"/>
  <text class="title" x="888" y="344" text-anchor="middle">置信度</text>
  <text class="sub" x="888" y="378" text-anchor="middle">长度归一化</text>
  <text class="sub" x="888" y="406" text-anchor="middle">序列分数</text>

  <circle cx="1028" cy="368" r="31" fill="#ffffff" stroke="#0071e3" stroke-width="3"/>
  <text class="title" x="1028" y="377" text-anchor="middle">τ</text>

  <path class="line" d="M1059 355C1080 340 1082 320 1082 303V294"/>
  <text class="route" x="1085" y="334">C ≥ τ</text>
  <rect class="accent" x="1008" y="214" width="144" height="78" rx="18"/>
  <text class="title" x="1080" y="248" text-anchor="middle">本地</text>
  <text class="sub" x="1080" y="275" text-anchor="middle">返回答案</text>

  <path class="line" d="M1059 381C1080 397 1082 421 1082 446V458"/>
  <text class="route" x="1085" y="425">C &lt; τ</text>
  <rect class="box" x="1000" y="474" width="160" height="112" rx="18"/>
  <text class="title" x="1080" y="516" text-anchor="middle">72B 云端</text>
  <text class="title" x="1080" y="546" text-anchor="middle">教师模型</text>
  <text class="tiny" x="1080" y="572" text-anchor="middle">最终答案</text>

  <text class="tiny" x="48" y="600">学生模型先处理每个查询；低置信度候选答案由教师模型独立生成的答案替换。</text>
</svg>
