<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Green-Edge-Cloud system architecture</title>
  <desc id="desc">Offline chain-of-thought distillation adapts a 1.5 billion parameter student model. Online, the student generates a candidate and token probabilities, a length-normalized confidence score is compared with a threshold, and the system either returns locally or invokes a 72 billion parameter cloud teacher.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#0071e3"/>
    </marker>
    <style>
      .label{font:700 22px Arial,"Helvetica Neue",sans-serif;letter-spacing:2px;fill:#6e6e73}
      .title{font:700 27px Arial,"Helvetica Neue",sans-serif;fill:#111111}
      .sub{font:400 20px Arial,"Helvetica Neue",sans-serif;fill:#6e6e73}
      .tiny{font:400 17px Arial,"Helvetica Neue",sans-serif;fill:#6e6e73}
      .route{font:700 18px Arial,"Helvetica Neue",sans-serif;fill:#0071e3}
      .box{fill:#ffffff;stroke:#d2d2d7;stroke-width:2}
      .accent{fill:#f8fbff;stroke:#0071e3;stroke-width:2.5}
      .line{fill:none;stroke:#0071e3;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="640" rx="30" fill="#f5f5f7"/>

  <text class="label" x="48" y="52">OFFLINE ADAPTATION</text>
  <rect class="box" x="48" y="78" width="190" height="92" rx="18"/>
  <text class="title" x="143" y="116" text-anchor="middle">72B Teacher</text>
  <text class="sub" x="143" y="146" text-anchor="middle">Qwen2.5</text>

  <path class="line" d="M238 124H326"/>
  <text class="tiny" x="282" y="106" text-anchor="middle">generate</text>

  <rect class="box" x="342" y="78" width="230" height="92" rx="18"/>
  <text class="title" x="457" y="116" text-anchor="middle">Filtered CoT</text>
  <text class="sub" x="457" y="146" text-anchor="middle">reasoning data</text>

  <path class="line" d="M572 124H646"/>
  <rect class="box" x="662" y="78" width="180" height="92" rx="18"/>
  <text class="title" x="752" y="116" text-anchor="middle">LoRA</text>
  <text class="sub" x="752" y="146" text-anchor="middle">adaptation</text>

  <path class="line" d="M842 124H910"/>
  <rect class="accent" x="926" y="78" width="226" height="92" rx="18"/>
  <text class="title" x="1039" y="116" text-anchor="middle">1.5B Student</text>
  <text class="sub" x="1039" y="146" text-anchor="middle">distilled model</text>

  <path d="M48 210H1152" stroke="#d2d2d7" stroke-width="2"/>
  <text class="label" x="48" y="258">ONLINE INFERENCE</text>

  <rect class="box" x="48" y="320" width="128" height="96" rx="18"/>
  <text class="title" x="112" y="378" text-anchor="middle">Query</text>
  <path class="line" d="M176 368H222"/>

  <rect class="accent" x="238" y="304" width="200" height="128" rx="20"/>
  <text class="title" x="338" y="352" text-anchor="middle">1.5B Student</text>
  <text class="sub" x="338" y="384" text-anchor="middle">edge role</text>
  <text class="tiny" x="338" y="410" text-anchor="middle">generate first</text>
  <path class="line" d="M438 368H482"/>

  <rect class="box" x="498" y="304" width="222" height="128" rx="20"/>
  <text class="title" x="609" y="346" text-anchor="middle">Candidate answer</text>
  <text class="sub" x="609" y="380" text-anchor="middle">generated-token</text>
  <text class="sub" x="609" y="408" text-anchor="middle">log-probabilities</text>
  <path class="line" d="M720 368H764"/>

  <rect class="box" x="780" y="304" width="216" height="128" rx="20"/>
  <text class="title" x="888" y="344" text-anchor="middle">Confidence</text>
  <text class="sub" x="888" y="378" text-anchor="middle">length-normalized</text>
  <text class="sub" x="888" y="406" text-anchor="middle">sequence score</text>

  <circle cx="1028" cy="368" r="31" fill="#ffffff" stroke="#0071e3" stroke-width="3"/>
  <text class="title" x="1028" y="377" text-anchor="middle">τ</text>
  <path class="line" d="M996 368H995"/>

  <path class="line" d="M1059 355C1080 340 1082 320 1082 303V294"/>
  <text class="route" x="1085" y="334">C ≥ τ</text>
  <rect class="accent" x="1008" y="214" width="144" height="78" rx="18"/>
  <text class="title" x="1080" y="248" text-anchor="middle">Local</text>
  <text class="sub" x="1080" y="275" text-anchor="middle">response</text>

  <path class="line" d="M1059 381C1080 397 1082 421 1082 446V458"/>
  <text class="route" x="1085" y="425">C &lt; τ</text>
  <rect class="box" x="1000" y="474" width="160" height="112" rx="18"/>
  <text class="title" x="1080" y="516" text-anchor="middle">72B Cloud</text>
  <text class="title" x="1080" y="546" text-anchor="middle">Teacher</text>
  <text class="tiny" x="1080" y="572" text-anchor="middle">final response</text>

  <text class="tiny" x="48" y="600">Student attempts every query; low-confidence candidates are replaced by an independently generated teacher response.</text>
</svg>
